name: Task
description: A unit of work that isn't an experiment
title: "[task] "
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: input
    id: done
    attributes:
      label: Definition of done
      description: One sentence — what exists when this is closed (a figure, a script, a section, a decision)
  - type: input
    id: due
    attributes:
      label: Target date (optional)
