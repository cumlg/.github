name: Experiment
description: Plan a run now; close it with a Result comment when it's done
title: "[exp] "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you know **now**. When the run is done, post a comment that starts with
        **Result:** — what happened, the number, the next step — and close the issue.
        An experiment closed without a Result comment counts as not done.
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis / question
      description: What are you testing, and what do you expect to see?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Model, key hyperparameters, data (which set, which version), branch or commit
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Links (optional)
      description: W&B run, Roboflow version, DVC hash — whichever you use
